# Week 11: Docker Compose Orchestration for Task Management Application
# CHARUSAT ITUE301 - Full Stack Containerization
version: '3.8'

services:
  # Database Service
  mongodb:
    image: mongo:7.0
    container_name: task_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - task_network

  # Backend REST API Service
  backend:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: task_backend_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/task_manager_db
      - JWT_SECRET=charusat_itue301_secret_key_2026
    depends_on:
      - mongodb
    networks:
      - task_network

  # Frontend React Service
  frontend:
    build:
      context: ./react-portfolio
      dockerfile: Dockerfile
    container_name: task_react_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - task_network

volumes:
  mongo_data:
    driver: local

networks:
  task_network:
    driver: bridge
